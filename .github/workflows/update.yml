name: Daily Yahoo Finance Cache Update

on:
  schedule:
    - cron: '30 22 * * 1-5' # 월~금 미국 장 마감 후 자동 실행 (한국시간 오전 7:30)
  workflow_dispatch: # GitHub에서 수동으로 버튼 눌러 실행 가능

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 최신 주가 수집 및 data_cache.csv 갱신
        run: python update_data.py

      - name: 변경된 데이터 자동 저장 (Vercel 자동 재배포 트리거)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_cache.csv
          git diff --staged --quiet || git commit -m "chore: update stock cache data"
          git push